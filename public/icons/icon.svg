<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="112" fill="#2563eb" />
  <!-- Paper top feed -->
  <rect x="156" y="96" width="200" height="100" rx="12" fill="#93c5fd" />
  <!-- Printer body -->
  <rect x="96" y="180" width="320" height="160" rx="28" fill="#ffffff" />
  <!-- LED dot -->
  <circle cx="370" cy="220" r="10" fill="#2563eb" />
  <!-- Paper output slot -->
  <rect x="136" y="260" width="240" height="24" rx="6" fill="#1d4ed8" />
  <!-- Output printed paper -->
  <rect x="156" y="272" width="200" height="144" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  <!-- Text lines on output paper -->
  <line x1="180" y1="310" x2="332" y2="310" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="340" x2="332" y2="340" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
  <line x1="180" y1="370" x2="280" y2="370" stroke="#93c5fd" stroke-width="6" stroke-linecap="round" />
</svg>
